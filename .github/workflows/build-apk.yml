name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build test APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK to match the app
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SiamVoice-Offline.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiamVoice-Offline
          path: app/build/outputs/apk/debug/SiamVoice-Offline.apk
          if-no-files-found: error
